<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Asesorantho</title>
<meta name="theme-color" content="#E9781C">
<meta name="description" content="CRM de Asesorantho Global Advisors">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CRM Asesorantho">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#E9781C;--naranja-2:#C9620F;--naranja-suave:#FDF0E5;
  --carbon:#575A5B;--tinta:#25292A;--gris:#7E8486;--gris-2:#A7ACAE;--linea:#E7E3DE;
  --fondo:#F5F3F0;--blanco:#FFFFFF;--panel:#FBFAF8;
  --verde:#1F9D55;--verde-suave:#E5F5EC;--rojo:#CF3F3F;--rojo-suave:#FBEAEA;
  --azul:#2F6FB3;--azul-suave:#E8F0FA;--ambar:#B7791F;--ambar-suave:#FFF4DC;
  --radio:14px;--sombra:0 1px 2px rgba(30,30,30,.05),0 6px 18px rgba(30,30,30,.06);
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--naranja-2)}
.hidden{display:none!important}
.ic{width:20px;height:20px;flex:none}
.ic.sm{width:16px;height:16px}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,#FBE3CC 0%,var(--fondo) 60%)}
.login-card{width:100%;max-width:400px;background:var(--blanco);border-radius:22px;padding:28px 24px;box-shadow:var(--sombra)}
.logo{width:52px;height:52px;border-radius:15px;background:var(--naranja);color:#fff;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
.login h1{margin:16px 0 2px;font-size:22px;letter-spacing:-.3px}
.login p.sub{margin:0 0 18px;color:var(--gris);font-size:14px}
.link{background:none;border:0;padding:0;color:var(--naranja-2);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- layout ---------- */
#app{min-height:100vh}
.sidebar{display:none}
.main{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,243,240,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linea)}
.topbar h2{margin:0;font-size:19px;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back{border:0;background:var(--blanco);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra);cursor:pointer}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--linea);background:var(--blanco);border-radius:99px;padding:5px 10px;font-size:12px;color:var(--carbon);cursor:pointer;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--gris-2)}
.sync.ok .dot{background:var(--verde)}
.sync.pend .dot{background:var(--ambar)}
.sync.off .dot{background:var(--gris)}
.sync.err .dot{background:var(--rojo)}
.sync.run .dot{background:var(--naranja);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
#view{padding:16px;max-width:1180px;margin:0 auto}
.demo-banner{background:var(--ambar-suave);color:#6B4A0E;font-size:13px;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--blanco);border-top:1px solid var(--linea);display:flex;padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
.bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--gris);cursor:pointer;padding:0}
.bottomnav button.on{color:var(--naranja)}
.bottomnav button.on .ic{stroke-width:2.3}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:31;width:56px;height:56px;border-radius:18px;border:0;background:var(--naranja);color:#fff;box-shadow:0 8px 20px rgba(233,120,28,.38);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab .ic{width:26px;height:26px;stroke-width:2.4}

@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:232px;background:var(--blanco);border-right:1px solid var(--linea);padding:20px 14px;gap:4px;z-index:25}
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
  .sidebar .brand .logo{width:38px;height:38px;font-size:21px;border-radius:11px}
  .sidebar .brand b{font-size:15px;line-height:1.15;display:block}
  .sidebar .brand small{color:var(--gris);font-size:12px}
  .sidebar nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--carbon);font-weight:500;text-align:left}
  .sidebar nav button:hover{background:var(--fondo)}
  .sidebar nav button.on{background:var(--naranja-suave);color:var(--naranja-2)}
  .sidebar .side-foot{margin-top:auto;font-size:12px;color:var(--gris);padding:8px}
  .main{margin-left:232px;padding-bottom:32px}
  .bottomnav{display:none}
  .fab{bottom:28px;right:28px}
  #view{padding:24px 28px}
}

/* ---------- componentes ---------- */
.card{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px}
.card+.card{margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--gris);font-size:12.5px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);padding:14px}
.kpi span{display:block;font-size:12px;color:var(--gris);font-weight:500}
.kpi b{display:block;font-size:22px;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.accent{background:var(--carbon);color:#fff}.kpi.accent span{color:#D9DCDD}
.cols2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cols2>*,.grid>*,.card{min-width:0}
@media (min-width:900px){.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.muted{color:var(--gris)}
.small{font-size:13px}
.empty{color:var(--gris);font-size:14px;padding:14px 4px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--linea);background:var(--blanco);border-radius:11px;padding:9px 14px;font-weight:500;cursor:pointer;min-height:40px;text-decoration:none;color:var(--tinta);white-space:nowrap}
.btn:hover{border-color:#D5D0CA}
.btn.pri{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.pri:hover{background:var(--naranja-2)}
.btn.dark{background:var(--carbon);border-color:var(--carbon);color:#fff}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.danger{color:var(--rojo);border-color:#F0CACA}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{border:1px solid var(--linea);background:var(--blanco);width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--carbon)}
.iconbtn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--linea);cursor:pointer;min-width:0}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--gris);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--naranja-suave);color:var(--naranja-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.avatar.emp{background:#ECEDED;color:var(--carbon)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill-due{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.due-late{background:var(--rojo-suave);color:var(--rojo)}
.due-soon{background:var(--ambar-suave);color:var(--ambar)}
.due-ok{background:var(--verde-suave);color:var(--verde)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--linea);border-radius:12px;background:var(--blanco);outline:none}
.search input:focus{border-color:var(--naranja)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gris)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linea);background:var(--blanco);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--carbon);border-color:var(--carbon);color:#fff}
select.inline{border:1px solid var(--linea);background:var(--blanco);border-radius:10px;padding:8px 10px;max-width:100%}

/* detalle cliente */
.hero{display:flex;gap:14px;align-items:center}
.hero .avatar{width:56px;height:56px;font-size:19px;border-radius:16px}
.hero h1{margin:0;font-size:20px;letter-spacing:-.3px;line-height:1.2}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.actions .btn{flex-direction:column;gap:3px;font-size:12px;padding:9px 4px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.dl dt{color:var(--gris)}
.dl dd{margin:0;word-break:break-word}
.deal{border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:10px}
.deal-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.deal-top b{display:block}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--linea)}
.tl:last-child{border-bottom:0}
.tl .ti{width:32px;height:32px;border-radius:10px;background:var(--fondo);display:flex;align-items:center;justify-content:center;flex:none;color:var(--carbon)}
.tl .ti.pend{background:var(--ambar-suave);color:var(--ambar)}
.tl .tx{flex:1;min-width:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.tl .meta{font-size:12px;color:var(--gris);margin-top:2px}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--gris-2);background:var(--blanco);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.check:hover{border-color:var(--verde);color:var(--verde)}

/* embudo */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;margin:0 -16px;padding-left:16px;padding-right:16px}
@media (min-width:900px){.board{margin:0;padding-left:0;padding-right:0}}
.col{flex:0 0 272px;scroll-snap-align:start;background:#EDEAE6;border-radius:var(--radio);padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 210px);overflow-y:auto}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px;font-weight:600;font-size:14px}
.col-h small{color:var(--gris);font-weight:500}
.dcard{background:var(--blanco);border-radius:11px;padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;font-size:13.5px}
.dcard b{display:block;font-size:14px}
.dcard .row{margin-top:7px;justify-content:space-between;flex-wrap:nowrap}
.dcard select{font-size:12px;padding:4px 6px;border:1px solid var(--linea);border-radius:8px;background:var(--panel);max-width:140px}

/* tablas reporte */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--linea);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
table.t th{color:var(--gris);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}

/* formularios */
.modal{position:fixed;inset:0;z-index:60;background:rgba(25,27,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--blanco);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--safe-b));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{border:0;background:var(--fondo);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--carbon);font-weight:500;min-width:0}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--linea);background:var(--panel);border-radius:11px;padding:10px 11px;outline:none;font-size:15px;color:var(--tinta);font-weight:400}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--naranja);background:#fff}
.fsec{grid-column:1/-1;margin:8px 0 0;padding-top:12px;border-top:1px solid var(--linea);font-size:13px;font-weight:600;color:var(--naranja-2)}
.cb{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.cb input{width:18px;height:18px;accent-color:var(--naranja)}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--gris);margin:4px 0 0}
.wa-prev{background:#E7F7EC;border-radius:12px;padding:12px;font-size:14px}
.imp-row{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--linea);font-size:14px}
.imp-row .grow{flex:1;min-width:0}
.imp-row small{display:block;color:var(--gris)}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 84px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
@media (min-width:900px){#toast{bottom:28px}}
.toast{background:var(--tinta);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.18);pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast.error{background:var(--rojo)}
.toast.ok{background:var(--verde)}
.toast button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
@media (max-width:420px){.fgrid{grid-template-columns:1fr}.actions .btn{font-size:11px}}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="login-card">
    <div class="logo">A</div>
    <h1>CRM Asesorantho</h1>
    <p class="sub" id="loginSub">Seguimiento de clientes del equipo</p>
    <div id="loginBody"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">A</div><div><b>Asesorantho</b><small>CRM del equipo</small></div></div>
    <nav id="sideNav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <div id="demoBanner" class="demo-banner hidden">
      <span><b>Modo demostración:</b> datos de ejemplo guardados solo en este dispositivo.</span>
      <button class="btn sm" onclick="salirDemo()">Salir de la demo</button>
    </div>
    <header class="topbar">
      <button class="back hidden" id="backBtn" onclick="history.back()" aria-label="Volver"></button>
      <h2 id="title">Inicio</h2>
      <button class="sync" id="syncPill" onclick="sincronizar(true)"><span class="dot"></span><span id="syncTxt">—</span></button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="bottomnav" id="bottomNav"></nav>
  <button class="fab" id="fab" aria-label="Nuevo"></button>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)cerrarModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="xlsx.full.min.js"></script>
<script>
if(!window.XLSX){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';document.head.appendChild(s);}
</script>
<script>
'use strict';
/* =========================================================
   CRM Asesorantho — app web instalable, funciona sin wifi
   Datos: este dispositivo (localStorage) + Google Sheets (sync)
   ========================================================= */
const VERSION = '1.1.0';
const K_CFG = 'crmA_cfg', K_DB = 'crmA_db', K_DEMO = 'crmA_demo';

const TABLAS = {
  clientes:   ['id','tipo','nombre','identificacion','empresa','cargo','telefono','email','ciudad','origen','etiquetas','notas','responsable','creadoPor','creadoEn','actualizadoPor','actualizadoEn','eliminado'],
  negocios:   ['id','clienteId','linea','servicio','etapa','valor','fechaCierre','fechaVencimiento','responsable','motivoPerdida','notas','creadoPor','creadoEn','actualizadoPor','actualizadoEn','eliminado'],
  actividades:['id','clienteId','negocioId','tipo','descripcion','fecha','hora','programada','completada','hechoPor','creadoPor','creadoEn','actualizadoPor','actualizadoEn','eliminado'],
  plantillas: ['id','nombre','linea','texto','orden','creadoPor','creadoEn','actualizadoPor','actualizadoEn','eliminado']
};

const LINEAS = {
  'Firma electrónica': ['Firma 1 año','Firma 2 años','Firma 3 años','Firma 4 años','Firma 5 años','Firma corto plazo (15–30 días)','Firma One Shot','Subdistribuidor de firmas'],
  'Contable y tributario': ['Contabilidad mensual','Declaración de IVA','Impuesto a la Renta','Régimen RIMPE','Facturación electrónica','Obtención de RUC','Estados financieros'],
  'RRHH y laboral': ['Afiliación IESS','Nómina / roles de pago','Contratos SUT','Reglamento Interno (MDT)','Seguridad y Salud Ocupacional'],
  'Societario (S.A.S.)': ['Constitución de S.A.S.','Liquidación de S.A.S.'],
  'Movilidad internacional': ['Pasantía Dubái / Abu Dabi (RMC Asia)','Pasantía en Asia (RMC Asia)','Inglés en EE. UU. (NYLC)','Inglés en EE. UU. (UCEDA)','Visa de turismo B1/B2','Intercambio cultural','Idiomas en Australia'],
  'Capacitación SST': ['PRL Construcción y Obra Civil','PRL Eléctrico','Riesgos Psicosociales','Espacios Confinados','Otra capacitación'],
  'Totemania': ['Totebags','Portavinos','Bolsas de doble cordón','Pedido corporativo']

/* SHA-256 (con respaldo en JS puro si el navegador no ofrece crypto.subtle) */
function sha256js(str){
  const ascii = unescape(encodeURIComponent(str));
  const rr = (v,a) => (v>>>a)|(v<<(32-a));
  const maxWord = Math.pow(2,32); let result=''; const words=[]; const bitLen = ascii.length*8;
  let hash=[]; const k=[]; let pc=0; const comp={};
  for(let c=2; pc<64; c++){ if(!comp[c]){ for(let i=0;i<313;i+=c) comp[i]=c; hash[pc]=(Math.pow(c,.5)*maxWord)|0; k[pc++]=(Math.pow(c,1/3)*maxWord)|0; } }
  let s = ascii + '\x80'; while(s.length%64-56) s+='\x00';
  for(let i=0;i<s.length;i++){ words[i>>2] |= s.charCodeAt(i) << ((3-i)%4)*8; }
  words[words.length] = (bitLen/maxWord)|0; words[words.length] = bitLen;
  for(let j=0;j<words.length;){
    const w = words.slice(j, j+=16); const old = hash; hash = hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i]
        + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash); hash[4] = (hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i] = (hash[i]+old[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; result += (b<16?'0':'') + b.toString(16); }
  return result;
}
async function hashPin(usuario, pin){
  const s = String(usuario).trim().toLowerCase() + ':' + String(pin).trim();
  try{
    if(window.crypto && crypto.subtle){
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256js(s);
}

let syncing = false, syncTimer = null, syncEstado = 'idle', syncError = '';

function programarSync(ms=1500){ clearTimeout(syncTimer); if(!cfg.demo && cfg.url) syncTimer = setTimeout(()=>sincronizar(), ms); pintarSync(); }

async function llamarServidor(url, payload){
  const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 30000);
  try{
    const r = await fetch(url, {method:'POST', body:JSON.stringify(payload), redirect:'follow', signal:ctrl.signal});
    const txt = await r.text();
    let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('El servidor no respondió como se esperaba. Revisa la URL y que la implementación tenga acceso "Cualquier usuario".'); }
    if(!j.ok){ const err = new Error(j.error || 'Error del servidor'); err.code = j.code; throw err; }
    return j;
  } catch(e){
    if(e.name === 'AbortError') throw new Error('El servidor tardó demasiado. Intenta de nuevo.');
    if(e instanceof TypeError) throw new Error('Sin conexión con el servidor.');
    throw e;
  } finally { clearTimeout(to); }
}

async function sincronizar(manual){
  if(!db) return;
  if(cfg.demo || !cfg.url){ if(manual) toast('En modo demostración no hay servidor: todo queda en este dispositivo.'); return; }
  if(syncing) return;
  if(!navigator.onLine){ syncEstado='off'; pintarSync(); if(manual) toast('Sin internet. Tus cambios están guardados y se enviarán al reconectar.'); return; }
  syncing = true; syncEstado = 'run'; pintarSync();
  const changes = {}, enviados = {};
  for(const t in TABLAS){
    changes[t] = []; enviados[t] = {};
    for(const id in db.dirty[t]){ const r = db[t][id]; if(r){ changes[t].push(pick(r, TABLAS[t])); enviados[t][id] = r.actualizadoEn; } else delete db.dirty[t][id]; }
  }
  try{
    const j = await llamarServidor(cfg.url, {action:'sync', usuario:cfg.user, pinHash:cfg.pinHash, since:db.lastSync||0, changes, version:VERSION});
    for(const t in TABLAS){
      for(const rec of (j.data && j.data[t]) || []){
        const loc = db[t][rec.id];
        if(loc && db.dirty[t][rec.id] && (loc.actualizadoEn||'') > (rec.actualizadoEn||'')) continue; // mi cambio local es más nuevo
        db[t][rec.id] = rec;
        if(enviados[t][rec.id] !== undefined) enviados[t][rec.id] = rec.actualizadoEn;
      }
      for(const id in enviados[t]){ const loc = db[t][id]; if(loc && loc.actualizadoEn === enviados[t][id]) delete db.dirty[t][id]; }
    }
    db.lastSync = j.serverTime; if(j.usuarios && j.usuarios.length) db.usuarios = j.usuarios;
    saveDB(); syncEstado = 'ok'; syncError = '';
    cfg.ultimaSync = Date.now(); LS.set(K_CFG, cfg);
    if(manual) toast('Sincronizado ✓','ok');
    renderSuave();
  } catch(e){
    syncEstado = 'err'; syncError = e.message;
    if(e.code === 'AUTH'){ toast('Tu usuario o PIN cambió en el servidor. Vuelve a ingresar.','error'); cerrarSesion(true); }
    else if(manual) toast('No se pudo sincronizar: ' + e.message, 'error');
  } finally { syncing = false; pintarSync(); }
}

function pintarSync(){
  const pill = $('#syncPill'); if(!pill || !db) return;
  const p = pendientes(); let cls='ok', txt='Sincronizado';
  if(cfg.demo){ cls='off'; txt='Demo'; }
  else if(syncEstado==='run'){ cls='run'; txt='Sincronizando…'; }
  else if(!navigator.onLine){ cls='off'; txt = p ? `Sin wifi · ${p} por enviar` : 'Sin wifi'; }
  else if(syncEstado==='err'){ cls='err'; txt = 'Error de sync'; }
  else if(p){ cls='pend'; txt = `${p} por enviar`; }
  pill.className = 'sync ' + cls; $('#syncTxt').textContent = txt;
  pill.title = syncError || (cfg.ultimaSync ? 'Última sincronización: ' + new Date(cfg.ultimaSync).toLocaleString('es-EC') : '');
}

async function ingresar(){
  const url = $('#urlIn').value.trim(), usuario = $('#userIn').value.trim().toLowerCase(), pin = $('#pinIn').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('La URL debe ser la de tu implementación de Apps Script (empieza con https://script.google.com/…).','error'); return; }
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Verificando…';
  try{
    const h = await hashPin(usuario, pin);
    const j = await llamarServidor(url, {action:'login', usuario, pinHash:h});
    const previo = LS.get(K_DB, null);
    if(previo && previo.url && previo.url !== url){ LS.del(K_DB); }
    cfg = {url, urlGuardada:url, user:usuario, ultimoUsuario:usuario, nombre:j.nombre, rol:j.rol, pinHash:h, demo:false};
    LS.set(K_CFG, cfg); SS.set('crmA_ok','1');
    loadDB(); db.url = url; if(j.usuarios) db.usuarios = j.usuarios; saveDB();
    iniciarApp(); sincronizar(true);
  } catch(e){ toast(e.message, 'error'); }
  finally { if(btn){ btn.disabled = false; btn.textContent = 'Ingresar'; } }
}

async function desbloquear(){
  if(Date.now() < bloqueoHasta){ toast('Demasiados intentos. Espera un minuto.','error'); return; }
  const h = await hashPin(cfg.user, $('#pinIn').value);
  if(h === cfg.pinHash){ intentosFallidos = 0; SS.set('crmA_ok','1'); loadDB(); iniciarApp(); sincronizar(); }
  else { intentosFallidos++; if(intentosFallidos>=5){ bloqueoHasta = Date.now()+60000; intentosFallidos=0; } toast('PIN incorrecto','error'); $('#pinIn').value=''; }
}

function cambiarEtapa(nid, etapa){
  const n = db.negocios[nid]; if(!n) return;
  const cambios = {id:nid, etapa};
  if(etapa==='Ganado' && !n.fechaCierre) cambios.fechaCierre = hoy();
  guardar('negocios', cambios);
  if(etapa==='Perdido' && !n.motivoPerdida){ formNegocio(nid); toast('Indica el motivo de pérdida para tus reportes.'); return; }
  if(etapa==='Ganado' && n.linea==='Firma electrónica' && !n.fechaVencimiento){ formNegocio(nid); toast('Registra la fecha de vencimiento para recordar la renovación.'); return; }
  toast(`Etapa: ${etapa}`, 'ok'); render();
}

function rango(t){
  const d = new Date(), H = hoy();
  if(t==='mes'){ estado.repDesde = H.slice(0,8)+'01'; estado.repHasta = H; }
  if(t==='mesant'){ const a = new Date(d.getFullYear(), d.getMonth()-1, 1), b = new Date(d.getFullYear(), d.getMonth(), 0); estado.repDesde = fechaLocal(a); estado.repHasta = fechaLocal(b); }
  if(t==='30'){ estado.repDesde = sumarDias(H,-29); estado.repHasta = H; }
  if(t==='anio'){ estado.repDesde = H.slice(0,4)+'-01-01'; estado.repHasta = H; }
  render();
}
function calcularReporte(desde, hasta){
  const en = f => f && (!desde || f >= desde) && (!hasta || f <= hasta);
  const base = () => ({nuevos:0, ganados:0, perdidos:0, valor:0});
  const porLinea = {}; Object.keys(LINEAS).forEach(l => porLinea[l] = base());
  const total = base(), porOrigen = {}, porResp = {};
  usuarios().forEach(u => porResp[u.usuario] = {act:0, ganados:0, valor:0});
  const resp = k => porResp[k||'—'] = porResp[k||'—'] || {act:0, ganados:0, valor:0};
  let clientesNuevos = 0;
  vivos('clientes').forEach(c => { if(en(isoLocal(c.creadoEn))){ clientesNuevos++; const o = c.origen || 'Sin origen'; porOrigen[o] = (porOrigen[o]||0)+1; } });
  vivos('negocios').forEach(n => {
    const L = porLinea[n.linea] = porLinea[n.linea] || base();
    if(en(isoLocal(n.creadoEn))){ L.nuevos++; total.nuevos++; }
    const fc = n.fechaCierre || isoLocal(n.actualizadoEn);
    if(n.etapa==='Ganado' && en(fc)){ L.ganados++; total.ganados++; L.valor += num(n.valor); total.valor += num(n.valor); const R = resp(n.responsable); R.ganados++; R.valor += num(n.valor); }
    if(n.etapa==='Perdido' && en(fc)){ L.perdidos++; total.perdidos++; }
  });
  vivos('actividades').forEach(a => { if(a.completada==='SI' && en(a.fecha)) resp(a.hechoPor||a.creadoPor).act++; });
  return {porLinea, total, porOrigen, porResp, clientesNuevos};
}

let waCtx = null;
function llenarPlantilla(texto, c, n){
  const d = n && n.fechaVencimiento ? diasHasta(n.fechaVencimiento) : null;
  const dt = d === null ? '' : d > 1 ? `en ${d} días` : d === 1 ? 'mañana' : d === 0 ? 'hoy' : d === -1 ? 'venció ayer' : `venció hace ${-d} días`;
  const map = { nombre: c.tipo==='Empresa' ? c.nombre : primerNombre(c.nombre), empresa: c.empresa || (c.tipo==='Empresa' ? c.nombre : 'tu empresa'),
    servicio: (n && (n.servicio || n.linea)) || 'nuestros servicios', vence: n && n.fechaVencimiento ? fmtFecha(n.fechaVencimiento) : '[fecha]', dias_texto: dt || '[días]', asesor: primerNombre(cfg.nombre) || 'el equipo' };
  return String(texto||'').replace(/\{(\w+)\}/g, (m,k) => map[k] !== undefined ? map[k] : m);
}
function abrirWA(clienteId, negocioId, tplId){
  const c = db.clientes[clienteId]; if(!c) return;
  const numero = waNumber(c.telefono);
  if(!numero){ toast('Este cliente no tiene teléfono registrado.','error'); formCliente(clienteId); return; }
  const n = (negocioId && db.negocios[negocioId]) || negocioPrincipal(clienteId);
  const linea = n ? n.linea : '';
  const tpls = vivos('plantillas').sort((a,b)=>{ const ra = a.linea===linea?0:a.linea?2:1, rb = b.linea===linea?0:b.linea?2:1; return ra-rb || num(a.orden)-num(b.orden); });
  const sel = tplId && db.plantillas[tplId] ? tplId : (tpls[0] ? tpls[0].id : '');
  waCtx = {clienteId, negocioId: n ? n.id : '', numero};
  abrirModal(`${cab('Mensaje de WhatsApp')}
    <div class="fgrid">
      <div class="fld full"><span>Para</span><b style="font-size:15px;color:var(--tinta)">${esc(c.nombre)} · +${esc(numero)}</b></div>
      ${fld('Plantilla', `<select id="waTpl" onchange="cambiarTplWA()">${opt(tpls.map(t=>[t.id,t.nombre+(t.linea?' ('+(LINEA_CORTA[t.linea]||t.linea)+')':'')]), sel)}<option value="">Mensaje libre</option></select>`, 'full')}
      ${fld('Mensaje (puedes editarlo)', `<textarea id="waTxt" style="min-height:150px;background:#E9F8EE"></textarea>`, 'full')}
      <label class="cb full" style="grid-column:1/-1"><input type="checkbox" id="waLog" checked> Guardar en el historial del cliente</label>
    </div>
    <div class="foot"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn wa" onclick="enviarWA()">${ic('chat','sm')} Abrir WhatsApp</button></div>`);
  if(tplId === '') $('#waTpl').value = '';
  cambiarTplWA();
}
function cambiarTplWA(){
  const c = db.clientes[waCtx.clienteId], n = db.negocios[waCtx.negocioId];
  const t = db.plantillas[$('#waTpl').value];
  $('#waTxt').value = t ? llenarPlantilla(t.texto, c, n) : `Hola ${primerNombre(c.nombre)}, `;
}
function enviarWA(){
  const texto = $('#waTxt').value.trim(); const t = db.plantillas[$('#waTpl').value];
  const url = 'https://wa.me/' + waCtx.numero + (texto ? '?text=' + encodeURIComponent(texto) : '');
  window.open(url, '_blank', 'noopener');
  if($('#waLog').checked){
    guardar('actividades', {clienteId:waCtx.clienteId, negocioId:waCtx.negocioId, tipo:'WhatsApp', descripcion:(t?t.nombre+': ':'')+texto.slice(0,600), fecha:hoy(), hora:horaActual(), programada:'NO', completada:'SI', hechoPor:cfg.user});
    const n = db.negocios[waCtx.negocioId];
    if(n && n.etapa==='Nuevo') guardar('negocios', {id:n.id, etapa:'Contactado'});
  }
  cerrarModal(); render();
  toast('Mensaje preparado en WhatsApp', 'ok', 'Programar seguimiento', () => formActividad({clienteId:waCtx.clienteId, negocioId:waCtx.negocioId, programada:true}));
}

function excelListo(){ if(window.XLSX) return true; toast('El módulo de Excel aún no está disponible. Abre la app una vez con internet.','error'); return false; }
const aFecha = s => { if(!s) return ''; const d = new Date(String(s).slice(0,10)+'T00:00:00'); return isNaN(d) ? s : d; };
function hoja(filas, anchos){ const ws = XLSX.utils.json_to_sheet(filas, {cellDates:true, dateNF:'dd/mm/yyyy'}); ws['!cols'] = anchos.map(w=>({wch:w})); if(filas.length) ws['!autofilter'] = {ref: ws['!ref']}; return ws; }

function exportarExcel(desde, hasta){
  if(!excelListo()) return;
  const en = f => (!desde || f >= desde) && (!hasta || f <= hasta);
  const C = id => db.clientes[id] || {};
  const r = calcularReporte(desde, hasta);
  const wb = XLSX.utils.book_new();
  const res = [['CRM Asesorantho — Reporte'], ['Periodo', desde ? `${fmtFecha(desde)} al ${fmtFecha(hasta)}` : 'Todo el historial'], ['Generado', new Date().toLocaleString('es-EC') + ' por ' + (cfg.nombre||'')], [],
    ['Clientes nuevos', r.clientesNuevos], ['Negocios nuevos', r.total.nuevos], ['Negocios ganados', r.total.ganados], ['Negocios perdidos', r.total.perdidos], ['Valor ganado (USD)', r.total.valor], [],
    ['Línea', 'Nuevos', 'Ganados', 'Perdidos', 'Valor ganado (USD)', 'Tasa de cierre'],
    ...Object.entries(r.porLinea).map(([k,o]) => [k, o.nuevos, o.ganados, o.perdidos, o.valor, o.ganados+o.perdidos ? o.ganados/(o.ganados+o.perdidos) : '']), [],
    ['Origen', 'Clientes nuevos'], ...Object.entries(r.porOrigen).sort((a,b)=>b[1]-a[1]), [],
    ['Responsable', 'Actividades', 'Ganados', 'Valor ganado (USD)'], ...Object.entries(r.porResp).map(([k,o]) => [nombreUsuario(k), o.act, o.ganados, o.valor])];
  const wsR = XLSX.utils.aoa_to_sheet(res); wsR['!cols'] = [{wch:30},{wch:14},{wch:12},{wch:12},{wch:18},{wch:14}];
  Object.keys(wsR).forEach(k => { if(k[0]==='F' && typeof wsR[k].v === 'number') wsR[k].z = '0%'; if((k[0]==='E'||k.startsWith('B9')) && typeof wsR[k].v === 'number') wsR[k].z = '"$"#,##0.00'; });
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumen');

  const cls = vivos('clientes').filter(c => !desde || en(isoLocal(c.creadoEn)));
  XLSX.utils.book_append_sheet(wb, hoja(cls.map(c => ({'Nombre':c.nombre,'Tipo':c.tipo,'Cédula/RUC':c.identificacion,'Empresa':c.empresa,'Cargo':c.cargo,'Teléfono':c.telefono,'Email':c.email,'Ciudad':c.ciudad,'Origen':c.origen,'Etiquetas':c.etiquetas,'Responsable':nombreUsuario(c.responsable),'Negocios':negociosDe(c.id).length,'Notas':c.notas,'Creado':aFecha(isoLocal(c.creadoEn)),'Creado por':nombreUsuario(c.creadoPor)})),
    [30,10,16,24,16,14,26,14,18,16,18,9,40,12,16]), 'Clientes');

  const ngs = vivos('negocios').filter(n => !desde || en(isoLocal(n.creadoEn)) || ((n.etapa==='Ganado'||n.etapa==='Perdido') && en(n.fechaCierre||isoLocal(n.actualizadoEn))));
  XLSX.utils.book_append_sheet(wb, hoja(ngs.map(n => ({'Cliente':C(n.clienteId).nombre||'','Teléfono':C(n.clienteId).telefono||'','Línea':n.linea,'Servicio':n.servicio,'Etapa':n.etapa,'Valor (USD)':num(n.valor),'Responsable':nombreUsuario(n.responsable),'Creado':aFecha(isoLocal(n.creadoEn)),'Fecha de cierre':aFecha(n.fechaCierre),'Vencimiento':aFecha(n.fechaVencimiento),'Motivo de pérdida':n.motivoPerdida,'Días sin movimiento':abierto(n)?diasSin(ultimoMovimiento(n)):'','Notas':n.notas})),
    [28,14,22,30,12,12,18,12,14,13,20,10,40]), 'Negocios');

  const acs = vivos('actividades').filter(a => a.completada==='SI' && (!desde || en(a.fecha)));
  XLSX.utils.book_append_sheet(wb, hoja(acs.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(a => ({'Fecha':aFecha(a.fecha),'Hora':a.hora,'Tipo':a.tipo,'Cliente':C(a.clienteId).nombre||'','Servicio':(db.negocios[a.negocioId]||{}).servicio||'','Descripción':a.descripcion,'Hecho por':nombreUsuario(a.hechoPor||a.creadoPor)})),
    [12,7,11,28,26,60,16]), 'Actividades');

  const ag = vivos('actividades').filter(a => a.programada==='SI' && a.completada!=='SI').sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  XLSX.utils.book_append_sheet(wb, hoja(ag.map(a => ({'Fecha':aFecha(a.fecha),'Hora':a.hora,'Tipo':a.tipo,'Cliente':C(a.clienteId).nombre||'','Teléfono':C(a.clienteId).telefono||'','Pendiente':a.descripcion,'Asignado a':nombreUsuario(a.hechoPor||a.creadoPor),'Estado':a.fecha<hoy()?'Atrasado':a.fecha===hoy()?'Hoy':'Próximo'})),
    [12,7,11,28,14,50,16,10]), 'Agenda pendiente');

  try{ XLSX.writeFile(wb, `CRM_Asesorantho_${desde ? desde+'_a_'+hasta : 'completo_'+hoy()}.xlsx`); toast('Excel descargado','ok'); }
  catch(e){ toast('No se pudo descargar el archivo: ' + e.message, 'error'); }
}

  const wsS = XLSX.utils.aoa_to_sheet([COLS_SEG, ['C001','María José Cedeño (ejemplo)', sumarDias(hoy(),1), '', 'WhatsApp', 'Ejemplo: pedir referidos']]);
  wsS['!cols'] = [{wch:8},{wch:30},{wch:12},{wch:8},{wch:11},{wch:70}]; XLSX.utils.book_append_sheet(wb, wsS, 'Seguimientos');
  const ayuda = [['Columna','Qué poner'],['Tipo','Persona o Empresa'],['Nombre*','Obligatorio'],['Teléfono*','Celular, ej. 0991234567 (se usa para WhatsApp)'],['Origen', ORIGENES.join(', ')],['Línea de interés', Object.keys(LINEAS).join(', ')],['Etapa', ETAPAS.join(', ')],['Vencimiento','Fecha en que vence la firma/visa (AAAA-MM-DD o dd/mm/aaaa)'],['Ref','Código corto del cliente (C001, C002…). Une cada cliente con sus filas de la pestaña Seguimientos.'],[''],['Pestaña Seguimientos','Una fila por tarea. Ref del cliente, Fecha (AAAA-MM-DD), Hora opcional, Tipo ('+TIPOS_ACT.join(', ')+') y la descripción. Se cargan en la Agenda del responsable elegido al importar. Sin Ref, se unen por el nombre del cliente.']];
  const w2 = XLSX.utils.aoa_to_sheet(ayuda); w2['!cols'] = [{wch:18},{wch:90}]; XLSX.utils.book_append_sheet(wb, w2, 'Instrucciones');
  XLSX.writeFile(wb, 'Plantilla_importacion_CRM_Asesorantho.xlsx');
}

const MAPA_COLS = {tipo:'tipo',nombre:'nombre',nombrecompleto:'nombre',razonsocial:'nombre',cedularuc:'identificacion',cedula:'identificacion',ruc:'identificacion',identificacion:'identificacion',empresa:'empresa',cargo:'cargo',telefono:'telefono',celular:'telefono',whatsapp:'telefono',movil:'telefono',email:'email',correo:'email',ciudad:'ciudad',origen:'origen',lineadeinteres:'linea',linea:'linea',servicio:'servicio',etapa:'etapa',valor:'valor',valorusd:'valor',vencimiento:'fechaVencimiento',fechadevencimiento:'fechaVencimiento',notas:'notas',responsable:'responsable',ref:'ref',referencia:'ref',codigo:'ref'};
const MAPA_SEG = {ref:'ref',referencia:'ref',codigo:'ref',cliente:'cliente',nombre:'cliente',telefono:'telefono',celular:'telefono',fecha:'fecha',hora:'hora',tipo:'tipo',seguimiento:'descripcion',descripcion:'descripcion',tarea:'descripcion',actividad:'descripcion'};
function leerSeguimientos(wb){
  const ws = wb.Sheets['Seguimientos']; if(!ws) return [];
  return XLSX.utils.sheet_to_json(ws, {defval:'', raw:true}).map(r => { const o = {}; for(const k in r){ const campo = MAPA_SEG[norm(k)]; if(campo) o[campo] = r[k]; } return o; })
    .map(o => {
      let hora = o.hora instanceof Date ? pad(o.hora.getHours())+':'+pad(o.hora.getMinutes()) : String(o.hora ?? '').trim();
      if(!/^\d{1,2}:\d{2}$/.test(hora)) hora = ''; else hora = hora.padStart(5,'0');
      return {ref:String(o.ref??'').trim(), cliente:String(o.cliente??'').trim(), telefono:String(o.telefono??'').trim(), fecha:fechaImport(o.fecha), hora,
        tipo: TIPOS_ACT.find(t => norm(t)===norm(o.tipo)) || 'WhatsApp', descripcion:String(o.descripcion??'').trim()};
    }).filter(o => o.fecha && o.descripcion && !/^ejemplo/i.test(o.descripcion));
}
function matchLinea(s){
  const n = norm(s); if(!n) return '';
  for(const l of Object.keys(LINEAS)) if(norm(l) === n || norm(LINEA_CORTA[l]) === n) return l;
  const pistas = [['firma','Firma electrónica'],['contab','Contable y tributario'],['tribut','Contable y tributario'],['sri','Contable y tributario'],['iva','Contable y tributario'],['rrhh','RRHH y laboral'],['laboral','RRHH y laboral'],['iess','RRHH y laboral'],['nomina','RRHH y laboral'],['sas','Societario (S.A.S.)'],['societ','Societario (S.A.S.)'],['constitu','Societario (S.A.S.)'],['liquida','Societario (S.A.S.)'],['movil','Movilidad internacional'],['visa','Movilidad internacional'],['pasant','Movilidad internacional'],['ingles','Movilidad internacional'],['rmc','Movilidad internacional'],['intercambio','Movilidad internacional'],['sst','Capacitación SST'],['capacit','Capacitación SST'],['prl','Capacitación SST'],['tote','Totemania'],['totem','Totemania']];
  const p = pistas.find(([k]) => n.includes(k)); return p ? p[1] : '';
}
function fechaImport(v){
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)) return fechaLocal(v);
  const s = String(v).trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return '';
}
function parseVCF(txt){
  txt = txt.replace(/\r\n?/g,'\n').replace(/=\n/g,'').replace(/\n[ \t]/g,'');
  const qp = s => { try{ return decodeURIComponent(escape(s.replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))))); }catch(e){ return s; } };
  const unesc = s => s.replace(/\\([,;:\\])/g,'$1').replace(/\\n/gi,' ');
  return txt.split(/BEGIN:VCARD/i).slice(1).map(card => {
    const o = {fn:'', n:'', telefono:'', email:'', empresa:''};
    for(const line of card.split('\n')){
      const i = line.indexOf(':'); if(i < 0) continue;
      const meta = line.slice(0,i), raw = line.slice(i+1).trim();
      const key = meta.split(';')[0].split('.').pop().toUpperCase();
      const val = unesc(/QUOTED-PRINTABLE/i.test(meta) ? qp(raw) : raw);
      if(key==='FN' && !o.fn) o.fn = val;
      else if(key==='N' && !o.n){ const p = val.split(';'); o.n = [p[1],p[2],p[0]].filter(Boolean).join(' ').trim(); }
      else if(key==='TEL' && (!o.telefono || /CELL|MOBILE/i.test(meta))) o.telefono = val;
      else if(key==='EMAIL' && !o.email) o.email = val;
      else if(key==='ORG' && !o.empresa) o.empresa = val.split(';')[0];
    }
    return {nombre:(o.fn||o.n).trim(), telefono:o.telefono, email:o.email, empresa:o.empresa, tipo:'Persona', origen:'WhatsApp'};
  }).filter(o => o.nombre || o.telefono);
}

let filasImport = [], segsImport = [];
async function importarArchivo(file){
  if(!file) return;
  try{
    let filas = []; segsImport = [];
    if(/\.vcf$/i.test(file.name) || /vcard/i.test(file.type)){
      filas = parseVCF(await file.text());
    } else {
      if(!excelListo()) return;
      const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
      const ws = wb.Sheets['Clientes'] || wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {defval:'', raw:true});
      segsImport = leerSeguimientos(wb);
      filas = raw.map(r => { const o = {}; for(const k in r){ const campo = MAPA_COLS[norm(k)]; if(campo) o[campo] = r[k]; } return o; })
        .map(o => {
          let tel = o.telefono instanceof Date ? '' : String(o.telefono ?? '').trim();
          if(/^9\d{8}$/.test(tel)) tel = '0' + tel;
          let ced = String(o.identificacion ?? '').trim(); if(/^\d{9}$/.test(ced) || /^\d{12}$/.test(ced)) ced = '0' + ced;
          return {...o, nombre:String(o.nombre??'').trim(), telefono:tel, identificacion:ced, fechaVencimiento:fechaImport(o.fechaVencimiento),
            linea:matchLinea(o.linea), etapa: ETAPAS.find(e => norm(e)===norm(o.etapa)) || (o.linea ? 'Nuevo' : ''),
            tipo: norm(o.tipo).startsWith('emp') ? 'Empresa' : 'Persona', origen: ORIGENES.find(x => norm(x)===norm(o.origen)) || (o.origen ? 'Otro' : ''), valor: String(o.valor ?? ''), ref: String(o.ref ?? '').trim()};
        }).filter(o => o.nombre && !/ejemplo/i.test(o.notas||''));
    }
    if(!filas.length){ toast('No encontré clientes en el archivo. Revisa que la primera fila tenga los títulos de la plantilla.','error'); return; }
    const existentes = vivos('clientes'); const vistos = new Set();
    filasImport = filas.map(f => {
      const tel = waNumber(f.telefono), ced = idNorm(f.identificacion);
      const clave = tel || (ced.length>=10 ? 'c'+ced : 'n'+norm(f.nombre));
      const dup = existentes.find(c => (tel && waNumber(c.telefono)===tel) || (ced.length>=10 && idNorm(c.identificacion)===ced)) || vistos.has(clave);
      vistos.add(clave);
      const existente = existentes.find(c => (tel && waNumber(c.telefono)===tel) || (ced.length>=10 && idNorm(c.identificacion)===ced));
      const segs = segsImport.filter(s => f.ref ? s.ref === f.ref : ((s.telefono && waNumber(s.telefono)===tel) || (s.cliente && norm(s.cliente)===norm(f.nombre))));
      return {...f, dup: !!dup, sel: !dup, existenteId: existente ? existente.id : '', segs};
    });
    const nSegs = filasImport.reduce((t,f) => t + f.segs.length, 0);
    abrirModal(`${cab('Importar clientes')}
      <p class="small muted" style="margin-top:0">${filasImport.length} encontrados · ${filasImport.filter(f=>f.dup).length} parecen duplicados (desmarcados).</p>
      <div class="row" style="margin-bottom:6px"><button class="btn sm" onclick="filasImport.forEach(f=>f.sel=!f.dup);pintarImport()">Solo nuevos</button><button class="btn sm" onclick="filasImport.forEach(f=>f.sel=false);pintarImport()">Ninguno</button></div>
      <div id="impList" style="max-height:48vh;overflow-y:auto"></div>
      ${fld('Responsable de estos clientes', `<select id="impResp">${optsUsuarios(cfg.user)}</select>`)}
      ${nSegs ? `<p class="small" style="margin:6px 0 0">${ic('clock','sm')} El archivo trae <b>${nSegs} seguimientos</b>: se agregarán a la Agenda del responsable.</p>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="impSegDup" checked style="width:16px;height:16px;accent-color:var(--naranja)"> Agregar también los seguimientos de los duplicados al cliente que ya existe</label>` : ''}
      <div class="foot"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" id="impBtn" onclick="confirmarImport()">Importar</button></div>`);
    pintarImport();
  } catch(e){ toast('No se pudo leer el archivo: ' + e.message, 'error'); }
}
function pintarImport(){
  $('#impList').innerHTML = filasImport.map((f,i) => `<label class="imp-row"><input type="checkbox" ${f.sel?'checked':''} onchange="filasImport[${i}].sel=this.checked;pintarImport()" style="width:18px;height:18px;accent-color:var(--naranja)">
    <div class="grow"><b>${esc(f.nombre||'(sin nombre)')}</b><small>${esc([f.telefono,f.email,f.empresa].filter(Boolean).join(' · '))}${f.linea?' · '+esc(LINEA_CORTA[f.linea]):''}${f.segs&&f.segs.length?' · '+f.segs.length+' seguimiento'+(f.segs.length>1?'s':''):''}</small></div>
    ${f.dup?'<span class="pill-due due-soon">Duplicado</span>':''}</label>`).join('');
  const n = filasImport.filter(f=>f.sel).length; $('#impBtn').textContent = `Importar ${n}`; $('#impBtn').disabled = !n;
}
function programarSegsImport(clienteId, negocioId, segs, resp){
  let k = 0; const ya = actividadesDe(clienteId);
  segs.forEach(s => {
    if(ya.some(a => a.fecha === s.fecha && (a.descripcion||'') === s.descripcion)) return; // evita duplicar si se importa dos veces
    guardar('actividades', {clienteId, negocioId:negocioId||'', tipo:s.tipo, descripcion:s.descripcion, fecha:s.fecha, hora:s.hora||'', programada:'SI', completada:'NO', hechoPor:resp}); k++;
  });
  return k;
}
function confirmarImport(){
  const resp = $('#impResp').value; let n = 0, ns = 0;
  const segDup = $('#impSegDup') ? $('#impSegDup').checked : false;
  filasImport.forEach(f => {
    if(f.sel){
      const c = guardar('clientes', {tipo:f.tipo||'Persona', nombre:f.nombre||f.telefono, identificacion:f.identificacion||'', empresa:f.empresa||'', cargo:f.cargo||'', telefono:f.telefono||'', email:f.email||'', ciudad:f.ciudad||'', origen:f.origen||'', etiquetas:'importado', notas:f.notas||'', responsable:resp});
      let neg = null;
      if(f.linea) neg = guardar('negocios', {clienteId:c.id, linea:f.linea, servicio:String(f.servicio||''), etapa:f.etapa||'Nuevo', valor:f.valor||'', fechaCierre:f.etapa==='Ganado'?hoy():'', fechaVencimiento:f.fechaVencimiento||'', responsable:resp, notas:''});
      if(f.segs && f.segs.length) ns += programarSegsImport(c.id, neg ? neg.id : '', f.segs, resp);
      n++;
    } else if(segDup && f.existenteId && f.segs && f.segs.length){
      const neg = negocioPrincipal(f.existenteId);
      ns += programarSegsImport(f.existenteId, neg ? neg.id : '', f.segs, resp);
    }
  });
  cerrarModal();
  toast((n === 1 ? '1 cliente importado' : `${n} clientes importados`) + (ns ? ` · ${ns} seguimientos en la Agenda` : ''), 'ok'); go('clientes');
}

/* ---------- avisos ---------- */
function toast(msg, tipo='', accion, fn){
  const t = document.createElement('div'); t.className = 'toast ' + tipo;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if(accion){ const b = document.createElement('button'); b.textContent = accion; b.onclick = () => { t.remove(); fn(); }; t.appendChild(b); }
  $('#toast').appendChild(t); setTimeout(() => t.remove(), accion ? 6500 : 3500);
}

/* ---------- instalación y funcionamiento sin wifi ---------- */
let eventoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; if(estado.ruta==='ajustes') renderSuave(); });
function instalarApp(){ if(eventoInstalar){ eventoInstalar.prompt(); eventoInstalar = null; render(); } }
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => { if(nw.state === 'installed' && navigator.serviceWorker.controller) toast('Hay una versión nueva del CRM.', '', 'Actualizar', () => location.reload()); });
    });
  }).catch(()=>{});
}
